
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金溢价率计算工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            color: #374151;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #3b82f6;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-section input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-success {
            background-color: #10b981;
            color: white;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-warning {
            background-color: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background-color: #d97706;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        .auto-refresh-section {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-left: auto;
        }

        .auto-refresh-section select {
            padding: 10px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
            color: #374151;
            position: sticky;
            top: 0;
        }

        tbody tr:nth-child(even) {
            background-color: #f9fafb;
        }

        tbody tr:hover {
            background-color: #e0f2fe;
        }

        .positive {
            color: #dc2626;
            font-weight: 600;
        }

        .negative {
            color: #059669;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .input-section {
                flex-direction: column;
            }

            .input-section input {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .action-buttons {
                flex-direction: column;
            }

            .auto-refresh-section {
                margin-left: 0;
                width: 100%;
                flex-direction: column;
            }

            .auto-refresh-section select,
            .auto-refresh-section .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>基金溢价率计算工具</h1>

        <div class="input-section">
            <input type="text" id="fundCode" placeholder="请输入基金代码（如：161725）" maxlength="10">
            <button class="btn btn-primary" onclick="addFund()">添加</button>
        </div>

        <div class="action-buttons">
            <button class="btn btn-success" onclick="refreshAllFunds()">刷新</button>
            <button class="btn btn-danger" onclick="deleteSelectedFunds()">删除</button>
            <div class="auto-refresh-section">
                <select id="refreshInterval">
                    <option value="10000">10秒</option>
                    <option value="30000">30秒</option>
                    <option value="60000" selected>1分钟</option>
                    <option value="300000">5分钟</option>
                </select>
                <button class="btn btn-warning" id="autoRefreshBtn" onclick="toggleAutoRefresh()">自动刷新</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                        <th>基金代码</th>
                        <th>基金名称</th>
                        <th>现价</th>
                        <th>最新净值</th>
                        <th>溢价率(最新净值)</th>
                        <th>净值日期</th>
                    </tr>
                </thead>
                <tbody id="fundTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let funds = [];
        let autoRefreshTimer = null;
        let isAutoRefreshing = false;

        // 新浪财经实时行情API回调函数
        window.getStockPrice = function(data) {
            if (window.priceResolver) {
                if (data && data.length > 0) {
                    const info = data[0];
                    window.priceResolver({
                        currentPrice: parseFloat(info[3]) || 0, // 现价
                        name: info[1] // 股票名称
                    });
                } else {
                    window.priceResolver(null);
                }
                window.priceResolver = null;
            }
        };

        // 天天基金净值API回调函数
        window.jsonpgz = function(data) {
            if (window.fundResolver) {
                if (data && data.fundcode) {
                    window.fundResolver({
                        latestNetValue: parseFloat(data.dwjz) || 0,
                        netValueDate: data.gzrq || '',
                        name: data.name
                    });
                } else {
                    window.fundResolver(null);
                }
                window.fundResolver = null;
            }
        };

        function loadFromStorage() {
            const stored = localStorage.getItem('fundList');
            if (stored) {
                try {
                    funds = JSON.parse(stored);
                    renderFundTable();
                } catch (e) {
                    console.error('加载数据失败:', e);
                }
            }
        }

        function saveToStorage() {
            localStorage.setItem('fundList', JSON.stringify(funds));
        }

        // 获取场内实时价格（使用新浪财经API）
        function fetchRealTimePrice(code) {
            return new Promise(function(resolve, reject) {
                window.priceResolver = resolve;
                
                const timeout = setTimeout(function() {
                    window.priceResolver = null;
                    reject(new Error('价格获取超时'));
                }, 8000);

                var script = document.createElement('script');
                script.src = 'https://hq.sinajs.cn/list=sh' + code + ',sz' + code;
                script.onload = function() {
                    clearTimeout(timeout);
                };
                script.onerror = function() {
                    clearTimeout(timeout);
                    window.priceResolver = null;
                    reject(new Error('价格获取失败'));
                };
                
                document.head.appendChild(script);
            });
        }

        // 获取基金净值（使用天天基金API）
        function fetchFundNetValue(code) {
            return new Promise(function(resolve, reject) {
                window.fundResolver = resolve;
                
                var timeout = setTimeout(function() {
                    window.fundResolver = null;
                    reject(new Error('净值获取超时'));
                }, 8000);

                var script = document.createElement('script');
                script.src = 'https://fundgz.1234567.com.cn/js/' + code + '.js?rt=' + Date.now();
                script.onload = function() {
                    clearTimeout(timeout);
                };
                script.onerror = function() {
                    clearTimeout(timeout);
                    window.fundResolver = null;
                    reject(new Error('净值获取失败'));
                };
                
                document.head.appendChild(script);
            });
        }

        async function addFund() {
            const input = document.getElementById('fundCode');
            const code = input.value.trim();
            
            if (!code) {
                alert('请输入基金代码！');
                return;
            }

            if (funds.some(function(f) { return f.code === code; })) {
                alert('该基金已在列表中！');
                return;
            }

            try {
                // 同时获取实时价格和净值
                const [priceData, netValueData] = await Promise.all([
                    fetchRealTimePrice(code).catch(function() { return null; }),
                    fetchFundNetValue(code)
                ]);

                if (!netValueData) {
                    alert('获取基金净值失败，请检查基金代码是否正确！');
                    return;
                }

                const currentPrice = priceData ? priceData.currentPrice : 0;
                const latestNetValue = netValueData.latestNetValue;
                
                // 计算溢价率 = (现价 - 最新净值) / 最新净值 × 100%
                const premiumRate = latestNetValue > 0 && currentPrice > 0
                    ? ((currentPrice - latestNetValue) / latestNetValue * 100).toFixed(2)
                    : 0;

                const fund = {
                    code: code,
                    name: netValueData.name || priceData?.name || '',
                    currentPrice: currentPrice,
                    latestNetValue: latestNetValue,
                    premiumRate: parseFloat(premiumRate),
                    netValueDate: netValueData.netValueDate
                };

                funds.push(fund);
                saveToStorage();
                renderFundTable();
                input.value = '';
                
            } catch (error) {
                console.error('添加基金失败:', error);
                alert('获取基金数据失败，请检查基金代码是否正确！');
            }
        }

        async function refreshAllFunds() {
            if (funds.length === 0) {
                alert('列表中没有基金！');
                return;
            }

            for (let i = 0; i < funds.length; i++) {
                try {
                    const [priceData, netValueData] = await Promise.all([
                        fetchRealTimePrice(funds[i].code).catch(function() { return null; }),
                        fetchFundNetValue(funds[i].code)
                    ]);

                    if (netValueData) {
                        const currentPrice = priceData ? priceData.currentPrice : funds[i].currentPrice;
                        const latestNetValue = netValueData.latestNetValue;
                        
                        const premiumRate = latestNetValue > 0 && currentPrice > 0
                            ? ((currentPrice - latestNetValue) / latestNetValue * 100).toFixed(2)
                            : 0;

                        funds[i].name = netValueData.name || funds[i].name;
                        funds[i].currentPrice = currentPrice;
                        funds[i].latestNetValue = latestNetValue;
                        funds[i].premiumRate = parseFloat(premiumRate);
                        funds[i].netValueDate = netValueData.netValueDate;
                    }
                } catch (error) {
                    console.error('刷新基金 ' + funds[i].code + ' 失败:', error);
                }
            }
            saveToStorage();
            renderFundTable();
        }

        function deleteSelectedFunds() {
            const checkboxes = document.querySelectorAll('.fund-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('请先选择要删除的基金！');
                return;
            }

            if (confirm('确定要删除选中的 ' + checkboxes.length + ' 只基金吗？')) {
                const selectedCodes = Array.from(checkboxes).map(function(cb) {
                    return cb.dataset.code;
                });
                funds = funds.filter(function(f) {
                    return !selectedCodes.includes(f.code);
                });
                saveToStorage();
                renderFundTable();
            }
        }

        function toggleAutoRefresh() {
            const btn = document.getElementById('autoRefreshBtn');
            const interval = parseInt(document.getElementById('refreshInterval').value);

            if (isAutoRefreshing) {
                clearInterval(autoRefreshTimer);
                isAutoRefreshing = false;
                btn.textContent = '自动刷新';
                btn.className = 'btn btn-warning';
            } else {
                if (funds.length === 0) {
                    alert('列表中没有基金，无法自动刷新！');
                    return;
                }
                autoRefreshTimer = setInterval(refreshAllFunds, interval);
                isAutoRefreshing = true;
                btn.textContent = '停止刷新';
                btn.className = 'btn btn-danger';
            }
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.fund-checkbox');
            checkboxes.forEach(function(cb) {
                cb.checked = selectAll.checked;
            });
        }

        function renderFundTable() {
            const tbody = document.getElementById('fundTableBody');
            
            if (funds.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><strong>暂无基金数据</strong><p>请在上方输入基金代码添加基金</p></td></tr>';
                return;
            }

            let html = '';
            for (let i = 0; i < funds.length; i++) {
                const fund = funds[i];
                const premiumClass = fund.premiumRate >= 0 ? 'positive' : 'negative';
                const premiumSign = fund.premiumRate >= 0 ? '+' : '';
                
                html += '<tr>' +
                    '<td><input type="checkbox" class="fund-checkbox" data-code="' + fund.code + '"></td>' +
                    '<td><strong>' + fund.code + '</strong></td>' +
                    '<td>' + fund.name + '</td>' +
                    '<td>' + (fund.currentPrice > 0 ? fund.currentPrice.toFixed(4) : '-') + '</td>' +
                    '<td>' + fund.latestNetValue.toFixed(4) + '</td>' +
                    '<td class="' + premiumClass + '">' + premiumSign + fund.premiumRate.toFixed(2) + '%</td>' +
                    '<td>' + fund.netValueDate + '</td>' +
                    '</tr>';
            }

            tbody.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadFromStorage();
        });
    </script>
</body>
</html>
