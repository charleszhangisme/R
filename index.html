
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金溢价率计算工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            color: #374151;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #3b82f6;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-section input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-success {
            background-color: #10b981;
            color: white;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-warning {
            background-color: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background-color: #d97706;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        .auto-refresh-section {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-left: auto;
        }

        .auto-refresh-section select {
            padding: 10px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
            color: #374151;
            position: sticky;
            top: 0;
        }

        tbody tr:nth-child(even) {
            background-color: #f9fafb;
        }

        tbody tr:hover {
            background-color: #e0f2fe;
        }

        .positive {
            color: #dc2626;
            font-weight: 600;
        }

        .negative {
            color: #059669;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #6b7280;
        }

        .empty-state p {
            margin-top: 10px;
        }

        .notice {
            background-color: #fef3c7;
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            color: #92400e;
        }

        .notice strong {
            display: block;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .input-section {
                flex-direction: column;
            }

            .input-section input {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .action-buttons {
                flex-direction: column;
            }

            .auto-refresh-section {
                margin-left: 0;
                width: 100%;
                flex-direction: column;
            }

            .auto-refresh-section select,
            .auto-refresh-section .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>基金溢价率计算工具</h1>

        <div class="notice">
            <strong>💡 使用提示：</strong>
            输入基金代码（如：161725）添加基金。基金代码可在天天基金网等平台查询。
        </div>

        <div class="input-section">
            <input type="text" id="fundCode" placeholder="请输入基金代码（如：161725）" maxlength="10">
            <button class="btn btn-primary" onclick="addFund()">添加</button>
        </div>

        <div class="action-buttons">
            <button class="btn btn-success" onclick="refreshAllFunds()">刷新</button>
            <button class="btn btn-danger" onclick="deleteSelectedFunds()">删除</button>
            <div class="auto-refresh-section">
                <select id="refreshInterval">
                    <option value="10000">10秒</option>
                    <option value="30000">30秒</option>
                    <option value="60000" selected>1分钟</option>
                    <option value="300000">5分钟</option>
                </select>
                <button class="btn btn-warning" id="autoRefreshBtn" onclick="toggleAutoRefresh()">自动刷新</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                        <th>基金代码</th>
                        <th>基金名称</th>
                        <th>现价</th>
                        <th>前一个交易日净值</th>
                        <th>溢价率(前净值)</th>
                        <th>估算净值</th>
                        <th>溢价率(估算)</th>
                        <th>净值日期</th>
                    </tr>
                </thead>
                <tbody id="fundTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let funds = [];
        let autoRefreshTimer = null;
        let isAutoRefreshing = false;

        function loadFromStorage() {
            const stored = localStorage.getItem('fundList');
            if (stored) {
                funds = JSON.parse(stored);
                renderFundTable();
            }
        }

        function saveToStorage() {
            localStorage.setItem('fundList', JSON.stringify(funds));
        }

        async function addFund() {
            const input = document.getElementById('fundCode');
            const code = input.value.trim();
            
            if (!code) {
                alert('请输入基金代码！');
                return;
            }

            if (funds.some(f => f.code === code)) {
                alert('该基金已在列表中！');
                return;
            }

            try {
                const fund = await fetchFundData(code);
                if (fund) {
                    funds.push(fund);
                    saveToStorage();
                    renderFundTable();
                    input.value = '';
                }
            } catch (error) {
                console.error('添加基金失败:', error);
                alert('获取基金数据失败，请检查基金代码是否正确！');
            }
        }

        async function fetchFundData(code) {
            return new Promise((resolve, reject) => {
                const callbackName = 'jsonpCallback_' + Date.now();
                
                window[callbackName] = function(data) {
                    try {
                        if (data && data.fundcode) {
                            const currentPrice = parseFloat(data.gsz || 0);
                            const lastNetValue = parseFloat(data.dwjz || 0);
                            const estimatedNetValue = parseFloat(data.gsz || 0);
                            
                            const lastNetPremiumRate = lastNetValue > 0 
                                ? ((currentPrice - lastNetValue) / lastNetValue * 100).toFixed(2) 
                                : 0;
                            const estimatedPremiumRate = estimatedNetValue > 0 
                                ? ((currentPrice - estimatedNetValue) / estimatedNetValue * 100).toFixed(2) 
                                : 0;

                            const fund = {
                                code: data.fundcode,
                                name: data.name,
                                currentPrice: currentPrice,
                                lastNetValue: lastNetValue,
                                lastNetPremiumRate: parseFloat(lastNetPremiumRate),
                                estimatedNetValue: estimatedNetValue,
                                estimatedPremiumRate: parseFloat(estimatedPremiumRate),
                                netValueDate: data.gztime ? data.gztime.split(' ')[0] : ''
                            };
                            
                            delete window[callbackName];
                            if (script.parentNode) {
                                script.parentNode.removeChild(script);
                            }
                            
                            resolve(fund);
                        } else {
                            delete window[callbackName];
                            reject(new Error('基金数据无效'));
                        }
                    } catch (error) {
                        delete window[callbackName];
                        reject(error);
                    }
                };

                const script = document.createElement('script');
                script.src = 'https://fundgz.1234567.com.cn/js/' + code + '.js?rt=' + Date.now() + '&callback=' + callbackName;
                script.onerror = function() {
                    delete window[callbackName];
                    if (script.parentNode) {
                        script.parentNode.removeChild(script);
                    }
                    reject(new Error('获取基金数据失败'));
                };

                setTimeout(function() {
                    if (window[callbackName]) {
                        delete window[callbackName];
                        if (script.parentNode) {
                            script.parentNode.removeChild(script);
                        }
                        reject(new Error('请求超时'));
                    }
                }, 10000);

                document.head.appendChild(script);
            });
        }

        async function refreshAllFunds() {
            if (funds.length === 0) {
                alert('列表中没有基金！');
                return;
            }

            for (let i = 0; i < funds.length; i++) {
                try {
                    const newData = await fetchFundData(funds[i].code);
                    if (newData) {
                        funds[i] = newData;
                    }
                } catch (error) {
                    console.error('刷新基金 ' + funds[i].code + ' 失败:', error);
                }
            }
            saveToStorage();
            renderFundTable();
        }

        function deleteSelectedFunds() {
            const checkboxes = document.querySelectorAll('.fund-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('请先选择要删除的基金！');
                return;
            }

            if (confirm('确定要删除选中的 ' + checkboxes.length + ' 只基金吗？')) {
                const selectedCodes = Array.from(checkboxes).map(function(cb) {
                    return cb.dataset.code;
                });
                funds = funds.filter(function(f) {
                    return !selectedCodes.includes(f.code);
                });
                saveToStorage();
                renderFundTable();
            }
        }

        function toggleAutoRefresh() {
            const btn = document.getElementById('autoRefreshBtn');
            const interval = parseInt(document.getElementById('refreshInterval').value);

            if (isAutoRefreshing) {
                clearInterval(autoRefreshTimer);
                isAutoRefreshing = false;
                btn.textContent = '自动刷新';
                btn.className = 'btn btn-warning';
            } else {
                if (funds.length === 0) {
                    alert('列表中没有基金，无法自动刷新！');
                    return;
                }
                autoRefreshTimer = setInterval(refreshAllFunds, interval);
                isAutoRefreshing = true;
                btn.textContent = '停止刷新';
                btn.className = 'btn btn-danger';
            }
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.fund-checkbox');
            checkboxes.forEach(function(cb) {
                cb.checked = selectAll.checked;
            });
        }

        function renderFundTable() {
            const tbody = document.getElementById('fundTableBody');
            
            if (funds.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty-state"><strong>暂无基金数据</strong><p>请在上方输入基金代码添加基金</p></td></tr>';
                return;
            }

            const html = funds.map(function(fund) {
                const lastNetClass = fund.lastNetPremiumRate >= 0 ? 'positive' : 'negative';
                const estimatedClass = fund.estimatedPremiumRate >= 0 ? 'positive' : 'negative';
                const lastNetSign = fund.lastNetPremiumRate >= 0 ? '+' : '';
                const estimatedSign = fund.estimatedPremiumRate >= 0 ? '+' : '';
                
                return '<tr>' +
                    '<td><input type="checkbox" class="fund-checkbox" data-code="' + fund.code + '"></td>' +
                    '<td><strong>' + fund.code + '</strong></td>' +
                    '<td>' + fund.name + '</td>' +
                    '<td>' + fund.currentPrice.toFixed(4) + '</td>' +
                    '<td>' + fund.lastNetValue.toFixed(4) + '</td>' +
                    '<td class="' + lastNetClass + '">' + lastNetSign + fund.lastNetPremiumRate.toFixed(2) + '%</td>' +
                    '<td>' + fund.estimatedNetValue.toFixed(4) + '</td>' +
                    '<td class="' + estimatedClass + '">' + estimatedSign + fund.estimatedPremiumRate.toFixed(2) + '%</td>' +
                    '<td>' + fund.netValueDate + '</td>' +
                    '</tr>';
            }).join('');

            tbody.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadFromStorage();
        });
    </script>
</body>
</html>
